services:
  - type: web
    name: nohunger-node-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  - type: web
    name: nohunger-ai-service
    env: python
    rootDir: pos codex
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python combined_app.py
    envVars:
      - key: ORDER_SERVICE_URL
        fromService:
          name: nohunger-node-backend
          type: web
          property: host
      - key: LOCAL_LLM_API_KEY
        value: GIrdT2X8joAQI01jSnqmyHVoGE93iBPA
      - key: LOCAL_LLM_TYPE
        value: openai_api
      - key: LOCAL_LLM_BASE_URL
        value: https://api.mistral.ai/v1
      - key: LOCAL_LLM_MODEL
        value: mistral-tiny
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: 8000
