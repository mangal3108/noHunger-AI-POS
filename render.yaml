services:
  - type: web
    name: nohunger-node-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  - type: web
    name: nohunger-ai-service
    env: python
    rootDir: pos codex
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn combined_app:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ORDER_SERVICE_URL
        fromService:
          name: nohunger-node-backend
          type: web
          property: host
      - key: GROQ_API_KEY
        sync: false
      - key: LOCAL_LLM_TYPE
        value: openai_api
      - key: LOCAL_LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LOCAL_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: 8000
