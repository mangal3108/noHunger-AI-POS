<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Admin Panel</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="topbar">
      <div>
        <p class="kicker">Admin</p>
        <h1>Restaurant Operations Console</h1>
      </div>
      <nav class="top-actions">
        <a class="link-btn" href="/">Open Chat</a>
      </nav>
    </header>

    <section class="grid">
      <article class="card">
        <div class="card-header">
          <h2>Live Notifications</h2>
          <span id="notifCount" class="pill">0 unread</span>
        </div>
        <div id="notifications" class="list"></div>
      </article>

      <article class="card">
        <div class="card-header">
          <h2>Recent Orders</h2>
          <button id="refreshOrders" class="mini-btn" type="button">Refresh</button>
        </div>
        <div id="orders" class="table-wrap"></div>
      </article>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Inventory</h2>
        <button id="refreshInventory" class="mini-btn" type="button">Refresh</button>
      </div>
      <div id="inventory" class="table-wrap"></div>
    </section>
  </main>

  <script src="/static/admin.js" defer></script>
</body>
</html>
